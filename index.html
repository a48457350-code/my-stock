<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c15">
<title>시드빌더 300 — 매일 자동 업데이트 국장 매매 앱</title>
<style>
  :root{--bg:#080c15;--bg2:#0f1625;--card:#141e33;--card2:#1a2742;--border:#243456;--text:#f0f4ff;--dim:#94a7c9;--faint:#63779b;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--accent:#3b82f6;--accent2:#8b5cf6;--cyan:#22d3ee}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;line-height:1.5;padding-bottom:78px}
  .app{max-width:760px;margin:0 auto;padding:14px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .top h1{font-size:17px;font-weight:900} .top .sub{font-size:11px;color:var(--dim)}
  .btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
  .btn.kakao{background:#fee500;color:#191919;border:none}
  .btn.good{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.45);color:#4ade80}
  .status{font-size:11.5px;padding:9px 12px;border-radius:11px;margin-bottom:10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#bbf7d0}
  .hero{border-radius:16px;padding:14px;margin-bottom:11px;border:1px solid var(--border);background:var(--card)}
  .hero.bull{border-color:rgba(34,197,94,.5)} .hero.neutral{border-color:rgba(245,158,11,.5)} .hero.bear{border-color:rgba(239,68,68,.55)}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
  .pill{background:rgba(8,12,21,.6);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px}
  .pill .k{font-size:10px;color:var(--dim)} .pill .v{font-size:13.5px;font-weight:900;margin-top:2px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:13px;margin-bottom:11px}
  .tab{background:none;border:none;color:var(--dim);padding:8px 4px;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer}
  .tab.active{background:linear-gradient(135deg,rgba(59,130,246,.32),rgba(139,92,246,.32));color:#fff}
  .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px;margin-bottom:11px}
  .ctrl label{display:block;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:3px}
  .ctrl input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:8px;font-size:13px;font-weight:700}
  .pick{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:13px;margin-bottom:11px;border-left:4px solid var(--good)}
  .why{background:rgba(8,12,21,.65);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:9px 11px;margin:8px 0;font-size:11.5px;color:#cbd5e1}
  .why ul{margin:4px 0 0 15px}
  .plan{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
  .pbox{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:8px}
  .pbox .k{font-size:10px;color:var(--dim)} .pbox .v{font-size:13.5px;font-weight:900;margin-top:2px}
  .nlink{display:block;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:#dbe7ff;text-decoration:none;font-size:11.5px;margin-bottom:5px}
  table{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--card);border-radius:12px;overflow:hidden}
  th,td{padding:8px;border-bottom:1px solid rgba(36,52,86,.6);text-align:left} th{color:var(--dim);background:var(--bg2)} .num{text-align:right}
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,27,.96);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:7px}
  .nav button{background:none;border:none;color:var(--dim);font-size:11px;font-weight:800;padding:6px;border-radius:9px;cursor:pointer}
  .nav button.active{color:#fff;background:rgba(59,130,246,.2)}
  .pane{display:none} .pane.active{display:block}
  .empty{background:var(--card);border:1px dashed var(--border);border-radius:13px;padding:20px;text-align:center;color:var(--dim);font-size:12px}
  @media(max-width:460px){.plan,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>📈 시드빌더 300 (자동화)</h1>
      <div class="sub">매일 자동 갱신 · 대용량 data.json · 카톡 연동</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn kakao" onclick="copyKakaoSummary()">💬 카톡 복사</button>
      <button class="btn primary" onclick="loadData()">🔄 새로고침</button>
    </div>
  </div>

  <div id="status" class="status">⏳ 최신 data.json 불러오는 중...</div>

  <div id="pane-main" class="pane active">
    <div id="hero" class="hero"></div>
    <div class="ctrl">
      <div><label>💵 내 시드 (원)</label><input id="seed" type="number" value="3000000" step="100000" oninput="renderPicks()"></div>
      <div><label>🛡️ 1회 손실한도 (%)</label><input id="risk" type="number" value="2.0" step="0.5" min="0.5" max="5" oninput="renderPicks()"></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="st-swing" onclick="setStrat('swing')">📈 스윙</button>
      <button class="tab" id="st-closeBet" onclick="setStrat('closeBet')">🌙 종가</button>
      <button class="tab" id="st-openBet" onclick="setStrat('openBet')">☀️ 시초가</button>
      <button class="tab" id="st-nxt" onclick="setStrat('nxt')">🌃 대체NXT</button>
    </div>
    <div id="picks"></div>
  </div>

  <div id="pane-rank" class="pane">
    <h3 style="font-size:14px;margin-bottom:8px">🏆 300종목 중 RS 상대강도 상위 50</h3>
    <table><thead><tr><th>종목</th><th class="num">현재가</th><th class="num">등락</th><th class="num">RS60</th><th class="num">EV</th></tr></thead><tbody id="rankBody"></tbody></table>
  </div>

  <div id="pane-news" class="pane">
    <h3 style="font-size:14px;margin-bottom:8px">⚡ 자동 수집 실시간 증시 뉴스</h3>
    <div id="newsBox"></div>
  </div>
</div>

<nav class="nav">
  <button class="active" id="nv-main" onclick="goPane('main')">🔥 오늘 추천</button>
  <button id="nv-rank" onclick="goPane('rank')">🏆 300종목 랭킹</button>
  <button id="nv-news" onclick="goPane('news')">⚡ 최신 뉴스</button>
</nav>

<script>
'use strict';
let DATA = null, STRAT = 'swing';
const $ = s => document.querySelector(s);
function esc(t){ const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; }
function fmtPx(v){ return Math.round(v).toLocaleString('ko-KR') + '원'; }
function fmtPct(v){ return (v>=0?'+':'') + Number(v).toFixed(1) + '%'; }

async function loadData(){
  try {
    const res = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    $('#status').innerHTML = `🟢 <b>${esc(DATA.updatedAt)}</b> · 총 ${DATA.scannedTotal}종목 스캔 · 정밀분석 ${DATA.analyzedDetail}종목`;
    renderAll();
  } catch(e){
    $('#status').innerHTML = '⚠️ data.json을 불러올 수 없습니다. GitHub Pages 웹 주소로 열어주세요.';
  }
}

function setStrat(s){
  STRAT = s;
  ['swing','closeBet','openBet','nxt'].forEach(k => $('#st-'+k).classList.toggle('active', k===s));
  renderPicks();
}
function goPane(p){
  ['main','rank','news'].forEach(k => {
    $('#pane-'+k).classList.toggle('active', k===p);
    $('#nv-'+k).classList.toggle('active', k===p);
  });
}

function renderAll(){
  if (!DATA) return;
  const r = DATA.regime, m = DATA.macro || {};
  const h = $('#hero');
  h.className = 'hero ' + r.type;
  h.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:12px;font-weight:800">${esc(r.badge)}</div>
        <div style="font-size:17px;font-weight:900;margin-top:4px">${esc(r.title)}</div>
      </div>
      <div style="font-size:28px;font-weight:900;color:${r.type==='bull'?'#4ade80':r.type==='neutral'?'#fbbf24':'#f87171'}">${r.score}</div>
    </div>
    <div class="grid-3">
      <div class="pill"><div class="k">코스피</div><div class="v">${r.items[0].close.toLocaleString()} (${fmtPct(r.items[0].chg)})</div></div>
      <div class="pill"><div class="k">나스닥 선물</div><div class="v">${fmtPct((m.futNasdaq&&m.futNasdaq.pct)||0)}</div></div>
      <div class="pill"><div class="k">원/달러 환율</div><div class="v">${fmtPct((m.fxKrw&&m.fxKrw.pct)||0)}</div></div>
    </div>`;
  renderPicks();
  $('#rankBody').innerHTML = (DATA.rankedTable||[]).map(x => `
    <tr>
      <td><b>${esc(x.name)}</b> <span style="color:var(--faint);font-size:10px">${esc(x.market)}</span></td>
      <td class="num">${Math.round(x.px).toLocaleString()}</td>
      <td class="num" style="color:${x.dayChg>=0?'#4ade80':'#f87171'}">${fmtPct(x.dayChg)}</td>
      <td class="num" style="color:#22d3ee;font-weight:800">${fmtPct(x.rs60)}</td>
      <td class="num" style="color:${x.ev>0?'#4ade80':'var(--dim)'}">${fmtPct(x.ev)}</td>
    </tr>`).join('');
  $('#newsBox').innerHTML = (DATA.news||[]).map(n => `<a class="nlink" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">📰 <b>[${esc(n.src)}]</b> ${esc(n.title)}</a>`).join('');
}

function renderPicks(){
  if (!DATA) return;
  const seed = Math.max(100000, Number($('#seed').value)||3000000);
  const risk = Math.max(0.5, Math.min(5, Number($('#risk').value)||2.0));
  const list = DATA[STRAT] || [];
  if (!list.length){ $('#picks').innerHTML = '<div class="empty">현재 이 전략의 조건을 통과한 종목이 없습니다 (현금 방어 권장).</div>'; return; }
  $('#picks').innerHTML = list.map((p, i) => {
    const riskAmt = seed * (risk / 100);
    let qty = Math.floor(riskAmt / Math.max(1, p.px - p.slPx));
    qty = Math.max(1, Math.min(qty, Math.floor((seed * 0.25) / p.px)));
    return `
      <div class="pick">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><b style="font-size:16px">${i+1}. ${esc(p.name)}</b> <span style="font-size:11px;color:var(--dim)">${esc(p.code)} · ${esc(p.market)}</span></div>
          <div style="text-align:right"><b style="font-size:15px">${fmtPx(p.px)}</b> <span style="font-size:11px;color:${p.dayChg>=0?'#4ade80':'#f87171'}">${fmtPct(p.dayChg)}</span></div>
        </div>
        <div class="why">
          <div style="font-size:11px;font-weight:800;color:var(--cyan)">🧠 매수 근거 (기댓값 ${fmtPct(p.ev)} · 승률 ${p.winRate}%)</div>
          <ul>${(p.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
        </div>
        <div class="plan">
          <div class="pbox"><div class="k">권장 수량</div><div class="v" style="color:#93c5fd">${qty}주</div></div>
          <div class="pbox"><div class="k">🛑 손절가</div><div class="v" style="color:#f87171">${fmtPx(p.slPx)}</div></div>
          <div class="pbox"><div class="k">🎯 익절가</div><div class="v" style="color:#4ade80">${fmtPx(p.tpPx)}</div></div>
        </div>
        ${(p.news||[]).map(n=>`<a class="nlink" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">📰 ${esc(n.title)} ↗</a>`).join('')}
      </div>`;
  }).join('');
}

function copyKakaoSummary(){
  if (!DATA) return;
  const lines = (DATA.swing||[]).slice(0,3).map((p,i)=>`${i+1}. ${p.name} (${fmtPx(p.px)}, EV ${fmtPct(p.ev)})`);
  const txt = `[시드빌더 ${DATA.updatedAt}]\n장세: ${DATA.regime.badge}\n` + (lines.length ? lines.join('\n') : '오늘 추천 종목 없음');
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  $('#status').innerHTML = '💬 카카오톡 전송용 요약이 복사되었습니다! 카톡 채팅방에 붙여넣기 하세요.';
}

loadData();
</script>
</body>
</html>
